name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      MAVEN_USERNAME: ${{ vars.MII_PACKAGES_USERNAME }}
      MAVEN_TOKEN: ${{ secrets.MII_PACKAGES_READ_TOKEN }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          server-id: github-mii
          server-username: MAVEN_USERNAME
          server-password: MAVEN_TOKEN

      - name: Check dependency credentials
        shell: bash
        run: |
          test -n "${MAVEN_USERNAME:-}"
          test -n "${MAVEN_TOKEN:-}"

      - name: Verify
        run: mvn --batch-mode --no-transfer-progress --fail-at-end clean verify
      - name: Verify
        run: mvn --batch-mode --no-transfer-progress --fail-at-end clean verify
